# The file keeps its name: the badge in README.md points at it.
name: Github Actions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# One run at a time against the live site: a run waits for the one before
# it instead of running beside it.
concurrency:
  group: live-site
  cancel-in-progress: false

jobs:
  test:
    name: webship-js on josa.ngo
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      FORCE_COLOR: "1"
      LAUNCH_URL: https://www.josa.ngo
      # No pause between browser actions: nobody watches a CI run.
      SLOW_MO: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Check for undefined and ambiguous steps
        run: npm run test:dry-run

      - name: Run tests
        run: npm test

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: webship-js-reports
          path: |
            tests/reports/
            tests/screenshots/
          if-no-files-found: ignore
          retention-days: 14
